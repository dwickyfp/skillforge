[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "skillforge"
version = "0.4.0"
description = "Self-Evolving Skill Intelligence Platform for AI Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dwicky Feriansyah Putra"},
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
viz = ["matplotlib>=3.7"]
all = ["pytest>=7.0", "pytest-cov", "matplotlib>=3.7"]

[project.scripts]
skillforge-benchmark = "skillforge.benchmark.runner:main"
skillforge = "skillforge.api.cli:main"
skillforge-mcp = "skillforge.mcp.server:main"

[project.urls]
Repository = "https://github.com/dwickyferiansyah/skillforge"
Documentation = "https://github.com/dwickyferiansyah/skillforge#readme"

[tool.setuptools.packages.find]
include = ["skillforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
